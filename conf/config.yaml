defaults:
  - model: age_spline_bmi_linear   # default model spec; override with model=...
  - serve: default # default serving config
  - schema: default # default schema config
  - _self_

data:
  path: data/reference.csv
  target: charges
  test_size: 0.2

gridsearch:
  enabled: true
  lam_min: -3
  lam_max: 4
  lam_num: 50

# mgcv estimates a lambda value per covariate; 
# here we approximate that with via a grid search (not ideal, though!)
# Note: mgcv is more advanced than this, but this is a simple approximation
gridsearchperterm:
  - {lam_min: -3, lam_max: 7, lam_num: 8}   # s(0) age  — spline, wide range
  - {lam_min: -1, lam_max: 3, lam_num: 8}   # l(1) bmi  — linear
  - {lam_min: 0,  lam_max: 0, lam_num: 1}   # f(2) smoker — factor; this range is intentional

mlflow:
  tracking_uri: sqlite:///${hydra:runtime.cwd}/mlflow.db
  experiment: insurance_gam

registry:
  enabled: false
  name: insurance-cost
  promote: false

ci: 0.95

seed: 42

alpha: 0.05